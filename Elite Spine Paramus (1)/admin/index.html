<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — Elite Spine &amp; Sports Care</title>
<link rel="icon" type="image/png" href="../images/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css" />
<link rel="stylesheet" href="editor.css" />
<link rel="stylesheet" href="settings.css" />
<link rel="stylesheet" href="analytics.css" />
</head>
<body>
<div class="gate" id="gate"><div class="gate__card auth"><img src="../images/logo.svg" alt="Elite Spine &amp; Sports Care" /><p>Loading the team portal…</p></div></div>
<div class="app" id="app" hidden>
  <aside class="side">
    <a class="side__logo" href="/" title="View website"><img src="../images/logo.svg" alt="Elite Spine &amp; Sports Care" /></a>
    <div class="side__label">Workspace</div>
    <button class="nav-item is-active" data-view="leads" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H5.17L4 17.17V4Z"></path><path d="M8 9h8M8 12h5"></path></svg>
      <span>Leads</span><span class="badge" id="navNew" hidden>0</span>
    </button>
    <button class="nav-item" data-view="analytics" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
      <span>Analytics</span>
    </button>
    <button class="nav-item" data-view="blog" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
      <span>Blog <span class="label-long">Posts</span></span>
    </button>
    <button class="nav-item" data-view="ai" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3Z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15Z"></path></svg>
      <span>AI Writer</span><span class="badge" id="navAi" hidden>0</span>
    </button>
    <div class="side__label" id="setupLabel" hidden>Setup</div>
    <button class="nav-item" data-view="pipelines" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.5"></rect><rect x="10" y="4" width="5" height="11" rx="1.5"></rect><rect x="17" y="4" width="4" height="7" rx="1.5"></rect></svg>
      <span>Pipelines</span>
    </button>
    <button class="nav-item" data-view="replies" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9 6 9-6"></path><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M15 15l2 2 4-4"></path></svg>
      <span>Auto-replies</span>
    </button>
    <button class="nav-item" data-view="users" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"></path></svg>
      <span>Users <span class="label-long">&amp; Access</span></span>
    </button>
    <div class="side__foot">
      <div class="side__user"><strong>Signed in</strong><span id="userEmail">—</span><span class="side__role" id="userRole"></span></div>
      <a class="nav-item" href="/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4 10 14"></path><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg>
        <span class="label-long">View site</span>
      </a>
      <button class="nav-item" id="pwBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
        <span class="label-long" id="pwLabel">Change password</span>
      </button>
      <button class="nav-item" id="logoutBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 12H4"></path><path d="m8 8-4 4 4 4"></path><path d="M13 4h6a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-6"></path></svg>
        <span class="label-long">Sign out</span>
      </button>
    </div>
  </aside>
  <main class="main">
    <div class="demo-bar" id="demoBar" hidden>
      <strong>Demo mode</strong>
      <span>Not connected to the live database. Sample data is stored in this browser only.</span>
      <label class="demo-as">View as <select class="select" id="demoAs"></select></label>
      <button class="btn btn--sm" id="demoReset" type="button">Reset sample data</button>
    </div>
    <section id="view-leads"></section>
    <section id="view-analytics" hidden></section>
    <section id="view-blog" hidden></section>
    <section id="view-ai" hidden></section>
    <section id="view-pipelines" hidden></section>
    <section id="view-replies" hidden></section>
    <section id="view-users" hidden></section>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="modal" id="previewModal"></div>
<div class="toast" id="toast"></div>
<script src="auth.js"></script>
<script src="admin.js"></script>
<script src="blog.js"></script>
<script src="users.js"></script>
<script src="settings.js"></script>
<script src="ai.js"></script>
<script src="analytics.js"></script>
</body>
</html>
